<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAKAO WALK arr! - 馬卡龍水彩探險地圖</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- MapTiler SDK & Leaflet Plugin CDN -->
    <link href="https://cdn.maptiler.com/maptiler-sdk-js/v2.0.0/maptiler-sdk.css" rel="stylesheet" />
    <script src="https://cdn.maptiler.com/maptiler-sdk-js/v2.0.0/maptiler-sdk.umd.js"></script>
    <script src="https://cdn.maptiler.com/leaflet-maptilersdk/v2.0.0/leaflet-maptilersdk.js"></script>

    <style>
        :root {
            --pastel-bg: #fffcf5;
            --pastel-card: rgba(255, 255, 255, 0.92);
            --pastel-pink: #ffb7c5;
            --pastel-yellow: #ffd3b6;
            --text-color: #5c544d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--pastel-bg);
            color: var(--text-color);
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        .hud-top {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 420px;
            background: var(--pastel-card);
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(180, 160, 150, 0.15);
            border: 2px solid #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-weight: 800;
            font-size: 1.05rem;
            color: #ff758c;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .radar-status {
            font-size: 0.8rem;
            background: #f0f3f8;
            padding: 4px 10px;
            border-radius: 12px;
            color: #6c757d;
            font-weight: 600;
        }

        .hud-bottom {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 420px;
            background: var(--pastel-card);
            backdrop-filter: blur(8px);
            padding: 16px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(180, 160, 150, 0.18);
            border: 2px solid #ffffff;
            text-align: center;
        }

        .target-title {
            font-size: 0.85rem;
            color: #8a817c;
            margin-bottom: 4px;
        }

        .target-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #4a4e69;
            margin-bottom: 6px;
        }

        .target-dist {
            font-size: 0.95rem;
            color: #ff7f50;
            font-weight: 700;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #e9ecef;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--pastel-pink), var(--pastel-yellow));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .custom-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
        }

        .player-avatar {
            width: 24px;
            height: 24px;
            background-color: #3a86ff;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(58, 134, 255, 0.6);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(58, 134, 255, 0.6); }
            70% { box-shadow: 0 0 0 14px rgba(58, 134, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(58, 134, 255, 0); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #ffffff;
            padding: 24px;
            border-radius: 28px;
            width: 85%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .modal-btn {
            margin-top: 16px;
            padding: 10px 24px;
            background: var(--pastel-pink);
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .toast {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1500;
            background: rgba(60, 60, 60, 0.85);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="hud-top">
        <div class="brand-title">🌸 TAKAO WALK arr!</div>
        <div class="radar-status" id="radar-status">📡 定位初始化...</div>
    </div>

    <div class="hud-bottom">
        <div class="target-title">距離最近的冒險點</div>
        <div class="target-name" id="target-name">搜尋中...</div>
        <div class="target-dist" id="target-dist">-- m</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="modal" id="win-modal">
        <div class="modal-content">
            <div style="font-size: 3rem; margin-bottom: 8px;">🎉</div>
            <h2 style="color: #ff758c; margin-bottom: 8px;">任務完成！</h2>
            <p style="color: #6c757d; font-size: 0.9rem; line-height: 1.5;">你已踏遍 TAKAO WALK arr! 所有馬卡龍景點！</p>
            <button class="modal-btn" onclick="closeModal('win-modal')">太棒了！</button>
        </div>
    </div>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'whistle') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(2200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'collect') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        const spots = [
            { id: 1, name: '奇美博物館', lat: 22.9348, lng: 120.2260, desc: '西洋藝術與古典城堡建築', icon: '🏛️', collected: false },
            { id: 2, name: '科工館', lat: 22.6405, lng: 120.3228, desc: '充滿驚奇與科幻的探索基地', icon: '🔬', collected: false },
            { id: 3, name: '六合夜市', lat: 22.6331, lng: 120.3002, desc: '飄香數十年的經典高雄美食地標', icon: '🍢', collected: false },
            { id: 4, name: '新崛江', lat: 22.6222, lng: 120.3015, desc: '潮流與時尚聚集的青藝天地', icon: '🛍️', collected: false },
            { id: 5, name: '駁二特區', lat: 22.6198, lng: 120.2818, desc: '港區倉庫改建的文創冒險樂園', icon: '🎨', collected: false },
            { id: 6, name: '哈瑪星', lat: 22.6215, lng: 120.2710, desc: '大片草地與舊鐵道的港灣時光', icon: '🚂', collected: false },
            { id: 7, name: 'SKM Park', lat: 22.5815, lng: 120.3300, desc: '美式樂園風的購物與遊樂天堂', icon: '🎡', collected: false }
        ];

        let userCoords = [22.6250, 120.3000];
        let map, playerMarker;
        let spotMarkers = {};

        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView(userCoords, 13);

            // 💡 使用你的 MapTiler Key 載入 Aquarelle 馬卡龍水彩風格
            const mtLayer = new L.maptiler.MaptilerLayer({
                apiKey: "DDhwtFjCbEWiteavezOK",
                style: "aquarelle"
            }).addTo(map);

            const playerIcon = L.divIcon({
                className: 'player-marker',
                html: '<div class="player-avatar"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            playerMarker = L.marker(userCoords, { icon: playerIcon }).addTo(map);

            spots.forEach(spot => {
                const icon = L.divIcon({
                    className: 'custom-icon',
                    html: `<div>${spot.icon}</div>`,
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });

                const marker = L.marker([spot.lat, spot.lng], { icon: icon }).addTo(map);
                marker.bindPopup(`<b>${spot.name}</b><br>${spot.desc}`);
                spotMarkers[spot.id] = marker;
            });

            map.on('click', (e) => {
                userCoords = [e.latlng.lat, e.latlng.lng];
                updatePlayerPosition(userCoords);
                playSound('whistle');
            });

            startGeolocation();
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return Math.round(R * c);
        }

        function updatePlayerPosition(coords) {
            playerMarker.setLatLng(coords);

            let nearest = null;
            let minDist = Infinity;
            let collectedCount = 0;

            spots.forEach(spot => {
                const dist = getDistance(coords[0], coords[1], spot.lat, spot.lng);
                if (dist <= 50 && !spot.collected) {
                    spot.collected = true;
                    playSound('collect');
                    showToast(`✨ 解鎖成功：${spot.name}！`);
                }

                if (spot.collected) collectedCount++;

                if (dist < minDist) {
                    minDist = dist;
                    nearest = spot;
                }
            });

            if (nearest) {
                document.getElementById('target-name').innerText = `${nearest.icon} ${nearest.name}`;
                document.getElementById('target-dist').innerText = minDist > 1000 ? `${(minDist / 1000).toFixed(1)} km` : `${minDist} m`;
            }

            const progressPercent = (collectedCount / spots.length) * 100;
            document.getElementById('progress-fill').style.width = `${progressPercent}%`;

            if (collectedCount === spots.length) {
                document.getElementById('win-modal').style.display = 'flex';
            }
        }

        function startGeolocation() {
            const statusEl = document.getElementById('radar-status');

            if (!navigator.geolocation) {
                statusEl.innerText = "⚠️ 瀏覽器不支援 GPS";
                return;
            }

            navigator.geolocation.watchPosition(
                (pos) => {
                    statusEl.innerText = "📡 雷達連線中";
                    userCoords = [pos.coords.latitude, pos.coords.longitude];
                    updatePlayerPosition(userCoords);
                },
                (err) => {
                    statusEl.innerText = "💡 試玩模式 (點地圖移動)";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        window.onload = initMap;
    </script>
</body>
</html>
