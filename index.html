<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TAKAO WALK arr!</title>
    
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --pastel-bg: #fffcf5;
            --pastel-card: rgba(255, 255, 255, 0.95);
            --pastel-pink: #ffb7c5;
            --pastel-yellow: #ffd3b6;
            --pastel-accent: #ff758c;
            --text-color: #5c544d;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; background-color: var(--pastel-bg);
            color: var(--text-color); position: fixed; top: 0; left: 0;
        }

        #map { width: 100vw; height: 100vh; height: 100dvh; z-index: 1; }

        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            z-index: 3000; display: flex; justify-content: center; align-items: flex-end;
            padding-bottom: calc(15vh + env(safe-area-inset-bottom, 30px));
            background-color: #f7f5f0; overflow: hidden;
        }

        .bg-cover-picture { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 1; }
        .bg-cover-image { width: 100vw; height: 100vh; height: 100dvh; object-fit: cover; object-position: center; }

        .login-content {
            position: relative; z-index: 2; width: 85%; max-width: 320px;
            display: flex; flex-direction: column; gap: 12px; justify-content: center; align-items: center;
        }

        .full-line-btn {
            width: 100%; background-color: #06C755; color: white; border: none;
            padding: 16px 24px; border-radius: 30px; font-weight: 800; font-size: 1.1rem;
            cursor: pointer; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35); transition: transform 0.15s ease;
        }
        .full-line-btn:active { transform: scale(0.96); }

        .test-skip-btn {
            width: 100%; background-color: rgba(255, 255, 255, 0.9); color: #5c544d;
            border: 2px dashed #ff758c; padding: 12px 20px; border-radius: 30px;
            font-weight: 800; font-size: 0.95rem; cursor: pointer; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .hud-top {
            position: absolute; top: calc(12px + env(safe-area-inset-top, 0px));
            left: 50%; transform: translateX(-50%); z-index: 1000; width: 94%; max-width: 480px;
            background: var(--pastel-card); backdrop-filter: blur(8px); padding: 8px 12px;
            border-radius: 20px; box-shadow: 0 8px 20px rgba(180, 160, 150, 0.15);
            border: 2px solid #ffffff; display: flex; justify-content: space-between; align-items: center;
        }

        .brand-container { display: flex; flex-direction: column; align-items: flex-start; }
        .brand-title { font-weight: 800; font-size: 0.9rem; color: #ff758c; }
        .road-name { font-size: 0.68rem; color: #e63946; font-weight: 700; margin-top: 1px; max-width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .action-tools { display: flex; gap: 4px; align-items: center; flex-wrap: nowrap; }

        .icon-btn {
            background: #ffffff; border: 1.5px solid #ffccd5; border-radius: 12px;
            padding: 5px 7px; display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 800; color: #5c544d; cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06); transition: transform 0.1s; white-space: nowrap;
        }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn.rocket-btn { background: #ffe5ec; border-color: #ff4d6d; color: #ff4d6d; }
        .icon-btn.feed-btn { background: #e8f5e9; border-color: #81c784; color: #2e7d32; }

        .dist-tracker {
            font-size: 0.75rem; background: #fff0f3; padding: 4px 6px; border-radius: 10px;
            color: #ff4d6d; font-weight: 800; border: 1px solid #ffccd5; white-space: nowrap;
        }

        .hud-bottom {
            position: absolute; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            left: 50%; transform: translateX(-50%); z-index: 1000; width: 90%; max-width: 420px;
            background: var(--pastel-card); backdrop-filter: blur(8px); padding: 14px 16px;
            border-radius: 24px; box-shadow: 0 10px 25px rgba(180, 160, 150, 0.18);
            border: 2px solid #ffffff; text-align: center;
        }

        .target-title { font-size: 0.8rem; color: #8a817c; margin-bottom: 2px; }
        .target-name { font-size: 1.15rem; font-weight: 800; color: #4a4e69; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .target-dist { font-size: 0.9rem; color: #ff7f50; font-weight: 700; }

        .progress-bar-bg { width: 100%; height: 10px; background: #e9ecef; border-radius: 10px; margin-top: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--pastel-pink), var(--pastel-yellow)); border-radius: 10px; transition: width 0.5s ease; }

        .food-icon-wrapper { display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .food-badge {
            width: 42px; height: 42px; background: #ffffff; border: 2px solid #ffb7c5;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.18); transition: transform 0.15s ease;
        }
        .food-badge:active { transform: scale(0.8); }
        .food-icon-img { width: 28px; height: 28px; object-fit: contain; }

        .coin-icon-wrapper { display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .coin-icon-img { width: 38px; height: 38px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); transition: transform 0.2s; }
        .hud-coin-img { width: 22px; height: 22px; object-fit: contain; }

        .player-avatar {
            width: 24px; height: 24px; background-color: #3a86ff; border: 3px solid #ffffff;
            border-radius: 50%; box-shadow: 0 0 12px rgba(58, 134, 255, 0.6); animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(58, 134, 255, 0.6); }
            70% { box-shadow: 0 0 0 14px rgba(58, 134, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(58, 134, 255, 0); }
        }

        .explore-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            z-index: 2900; background: rgba(20, 20, 25, 0.65); backdrop-filter: blur(6px);
            justify-content: center; align-items: flex-end;
        }

        .explore-card {
            width: 100%; max-width: 480px; max-height: 85vh; max-height: 85dvh; background: #ffffff;
            border-radius: 28px 28px 0 0; display: flex; flex-direction: column; padding: 20px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3); overflow-y: auto;
        }

        .explore-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .explore-title { font-size: 1.2rem; font-weight: 800; color: #ff4d6d; }

        .explore-sub-bar {
            display: flex; justify-content: space-between; align-items: center; background: #fdf2f4;
            padding: 10px 14px; border-radius: 14px; margin-bottom: 14px; border: 1px solid #ffe3e8;
        }
        .explore-sub-text { font-size: 0.82rem; font-weight: 700; color: #7209b7; }

        .rocket-list { display: flex; flex-direction: column; gap: 12px; }
        .rocket-item {
            background: #faf8f5; border: 1.5px solid #ffe3e8; border-radius: 18px;
            padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .rocket-item.launched-item { background: #f0f0f0; border-color: #ddd; opacity: 0.8; }

        .rocket-info { display: flex; align-items: center; gap: 12px; flex: 1; }
        .rocket-img {
            width: 46px; height: 46px; object-fit: contain; background: #ffffff;
            border-radius: 12px; padding: 4px; border: 1.5px solid #ffccd5; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .rocket-text { display: flex; flex-direction: column; flex: 1; }
        .rocket-name { font-weight: 800; font-size: 0.95rem; color: #4a4e69; }
        .rocket-progress-text { font-size: 0.78rem; color: #8a817c; font-weight: 700; margin-top: 2px; }

        .launch-btn {
            background: #cccccc; color: #ffffff; border: none; padding: 8px 14px;
            border-radius: 16px; font-weight: 800; font-size: 0.85rem; cursor: not-allowed;
            transition: all 0.2s ease; white-space: nowrap;
        }
        .launch-btn.ready {
            background: linear-gradient(135deg, #ff758c, #ff4d6d); cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 77, 109, 0.4); animation: bounce 1.2s infinite alternate;
        }
        .launch-btn.launched { background: #b0bec5; color: white; cursor: not-allowed; animation: none; }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-3px); } }

        .video-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            z-index: 5000; background: #000000; justify-content: center; align-items: center;
        }
        .video-overlay video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

        .line-reward-btn {
            width: 100%; background: #06C755; color: white; border: none; padding: 14px 20px;
            border-radius: 24px; font-weight: 800; font-size: 1.05rem; cursor: pointer; margin-top: 14px;
            box-shadow: 0 6px 18px rgba(6, 199, 85, 0.35); transition: transform 0.15s ease;
        }
        .line-reward-btn:active { transform: scale(0.96); }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(4px); z-index: 3500;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: #ffffff; padding: 24px; border-radius: 28px; width: 85%; max-width: 360px;
            text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
        .modal-btn {
            margin-top: 16px; padding: 10px 24px; background: var(--pastel-pink); color: white;
            border: none; border-radius: 20px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
        }

        .toast {
            position: absolute; top: 85px; left: 50%; transform: translateX(-50%); z-index: 4000;
            background: rgba(40, 40, 40, 0.9); color: white; padding: 10px 20px; border-radius: 20px;
            font-size: 0.88rem; display: none; backdrop-filter: blur(4px); font-weight: 700;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); text-align: center; white-space: nowrap;
        }
    </style>
</head>
<body>

    <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>

    <div class="login-overlay" id="login-overlay">
        <picture class="bg-cover-picture">
            <source media="(orientation: landscape)" srcset="cover_computer.jpg">
            <img src="cover_phone.jpg" alt="" class="bg-cover-image">
        </picture>
        
        <div class="login-content">
            <button class="full-line-btn" onclick="loginWithLine()">使用 LINE 帳號登入</button>
            <button class="test-skip-btn" onclick="skipLoginForTesting()">⚡ 測試模式（跳過登入）</button>
        </div>
    </div>

    <div id="map"></div>

    <div class="hud-top">
        <div class="brand-container">
            <div class="brand-title" id="brand-title">🌸 冒險家</div>
            <div class="road-name" id="road-name">📍 定位中...</div>
        </div>
        <div class="action-tools">
            <button class="icon-btn feed-btn" onclick="scanNearbyRealPlaces()">📡 掃描實體地標</button>
            <button class="icon-btn rocket-btn" onclick="openExploreModal()">🚀 探險</button>
            <button class="icon-btn" id="recenter-btn" onclick="recenterMap()">🎯 定位</button>
            <button class="icon-btn" id="bgm-btn" onclick="toggleBGM()">🎵</button>
            <div class="dist-tracker" id="total-walked">🚶 0.00 km</div>
        </div>
    </div>

    <div class="hud-bottom">
        <div class="target-title">距離最近的冒險點</div>
        <div class="target-name" id="target-name">搜尋中...</div>
        <div class="target-dist" id="target-dist">-- m</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </div>

    <div class="explore-modal" id="explore-modal" onclick="closeExploreModal(event)">
        <div class="explore-card" onclick="event.stopPropagation()">
            <div class="explore-header">
                <div class="explore-title">🚀 火箭探險進度</div>
                <button class="icon-btn" style="position:static;" onclick="closeExploreModal()">✕</button>
            </div>
            
            <div class="explore-sub-bar">
                <div class="explore-sub-text">💡 造訪真實地標收集 12 個能量球充能！</div>
                <button class="icon-btn feed-btn" onclick="scanNearbyRealPlaces()">📡 重新掃描地標</button>
            </div>

            <div class="rocket-list" id="rocket-list"></div>
        </div>
    </div>

    <div class="video-overlay" id="video-overlay">
        <video id="rocket-video" playsinline webkit-playsinline></video>
    </div>

    <div class="modal" id="coin-reward-modal">
        <div class="modal-content">
            <div style="font-size: 3.2rem; margin-bottom: 6px;">🪙</div>
            <h2 id="coin-modal-title" style="color: #ff758c; margin-bottom: 8px;">獲得金幣！</h2>
            <p id="coin-modal-desc" style="color: #6c757d; font-size: 0.92rem; line-height: 1.5;">請點擊下方按鈕前往 LINE 領取集點！</p>
            <button id="coin-modal-link-btn" class="line-reward-btn">🟢 前往 LINE 領取集點</button>
            <button class="modal-btn" style="background:#b0bec5; margin-top: 10px;" onclick="closeModal('coin-reward-modal')">稍後領取</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbx-ZuM0QX6rncNxsUcBct7CIcK89UVhgn3KOsJiPRug4NIFzTzX3LdtCUgd-546oRSJSQ/exec';
        const LINE_CHANNEL_ID = '2011007742';

        const LINE_STAMP_URLS = {
            1: 'https://u.lin.ee/XAVBp5D',
            2: 'https://u.lin.ee/zdsJMfi',
            3: 'https://u.lin.ee/z60aQv3'
        };

        // 🍡 更新後的 5 款美食能量球與動態檔名設定
        const foodTypes = [
            { key: 'rice', name: '咕嚕飯', rocketName: '咕嚕飯一號', planetName: '咕嚕飯星球', img: 'rice.svg', video: 'rice_planet.mp4' },
            { key: 'noodle', name: '咕唧麵', rocketName: '咕唧麵一號', planetName: '咕唧麵星球', img: 'noodle.svg', video: 'noodle_planet.mp4' },
            { key: 'latte', name: '冰拿鐵', rocketName: '冰拿鐵一號', planetName: '冰拿鐵星球', img: 'latte.svg', video: 'latte_planet.mp4' },
            { key: 'boba', name: '啵啵奶', rocketName: '啵啵奶一號', planetName: '啵啵奶星球', img: 'boba.svg', video: 'boba_planet.mp4' },
            { key: 'marshmallow', name: '棉花糖', rocketName: '棉花糖一號', planetName: '棉花糖星球', img: 'marshmallow.svg', video: 'marshmallow_planet.mp4' }
        ];

        let foodCounts = { rice: 0, noodle: 0, latte: 0, boba: 0, marshmallow: 0 };
        let launchedRockets = { rice: false, noodle: false, latte: false, boba: false, marshmallow: false };
        let activeFoodMarkers = [];
        let loadedPlaceIds = new Set(); // 避免重複載入地標

        let currentLineId = null;
        let currentName = null;
        let isBgmPlaying = true;
        let userCoords = [22.6250, 120.3000];
        let map, playerMarker;
        let totalDistanceMeters = 0;
        let previousPosition = null;
        let lastScanPosition = null;

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false, minZoom: 7, maxZoom: 18 }).setView(userCoords, 16);
            L.tileLayer('https://api.maptiler.com/maps/aquarelle-v4/256/{z}/{x}/{y}.png?key=DDhwtFjCbEWiteavezOK', { minZoom: 7, maxZoom: 18 }).addTo(map);

            const playerIcon = L.divIcon({
                className: 'player-marker',
                html: '<div class="player-avatar"></div>',
                iconSize: [24, 24], iconAnchor: [12, 12]
            });
            playerMarker = L.marker(userCoords, { icon: playerIcon }).addTo(map);

            checkUrlParamsAndInit();
        }

        // 🌐 串接 Overpass API 抓取真實地標並生成能量球
        async function scanNearbyRealPlaces() {
            if (!userCoords) return;
            showToast('📡 掃描周邊真實店家與超商中...');

            const [lat, lng] = userCoords;
            const radius = 300; // 掃描周圍 300 公尺

            const query = `
                [out:json][timeout:10];
                (
                  node["shop"="convenience"](around:${radius},${lat},${lng});
                  node["shop"="beverage"](around:${radius},${lat},${lng});
                  node["shop"="bakery"](around:${radius},${lat},${lng});
                  node["shop"="pastry"](around:${radius},${lat},${lng});
                  node["amenity"="restaurant"](around:${radius},${lat},${lng});
                  node["amenity"="fast_food"](around:${radius},${lat},${lng});
                  node["amenity"="cafe"](around:${radius},${lat},${lng});
                );
                out body 25;
            `;

            try {
                const res = await fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query));
                const data = await res.json();
                
                if (data && data.elements) {
                    let newSpawnCount = 0;
                    data.elements.forEach(place => {
                        if (loadedPlaceIds.has(place.id)) return;
                        
                        const foodKey = classifyPlaceToFoodKey(place);
                        if (foodKey) {
                            loadedPlaceIds.add(place.id);
                            spawnFoodAtRealLocation(place.lat, place.lon, place.tags?.name || '在地名店', foodKey);
                            newSpawnCount++;
                        }
                    });

                    if (newSpawnCount > 0) {
                        showToast(`✨ 精準匯入！發現 ${newSpawnCount} 家真實地標並生成能量球！`);
                    } else {
                        showToast('📍 周邊地標已載入完成');
                    }
                }
            } catch (err) {
                console.error('Overpass API 讀取失敗', err);
                showToast('📡 網路微弱，改為輔助生成');
            }
        }

        // 🏷️ 店家類別分類判斷
        function classifyPlaceToFoodKey(place) {
            const tags = place.tags || {};
            const shop = tags.shop || '';
            const amenity = tags.amenity || '';
            const name = tags.name || '';

            if (shop === 'convenience') return 'latte'; // 超商 -> 冰拿鐵
            if (shop === 'beverage' || amenity === 'cafe') return 'boba'; // 飲料店/咖啡 -> 啵啵奶
            if (shop === 'bakery' || shop === 'pastry') return 'marshmallow'; // 麵包甜點 -> 棉花糖

            if (amenity === 'restaurant' || amenity === 'fast_food') {
                if (name.includes('麵') || name.includes('拉麵') || name.includes('義式') || name.toLowerCase().includes('noodle')) {
                    return 'noodle'; // 麵食 -> 咕唧麵
                }
                return 'rice'; // 預設飯類 -> 咕嚕飯
            }
            return null;
        }

        // 📍 建立真實店家能量球 Marker
        function spawnFoodAtRealLocation(lat, lng, shopName, foodKey) {
            const food = foodTypes.find(f => f.key === foodKey);
            if (!food) return;

            const foodIcon = L.divIcon({
                className: 'food-icon-wrapper',
                html: `
                    <div class="food-badge" title="${shopName}">
                        <img src="${food.img}" class="food-icon-img" alt="${food.name}">
                    </div>
                `,
                iconSize: [42, 42], iconAnchor: [21, 21]
            });

            const marker = L.marker([lat, lng], { icon: foodIcon }).addTo(map);

            marker.on('click', () => {
                map.removeLayer(marker);
                activeFoodMarkers = activeFoodMarkers.filter(m => m !== marker);
                foodCounts[foodKey] = (foodCounts[foodKey] || 0) + 1;
                
                showToast(`🎉 於【${shopName}】採集 1 個【${food.name}能量球】！`);
                saveLocalState();
                syncDataToGAS();

                if (document.getElementById('explore-modal').style.display === 'flex') {
                    renderExploreRockets();
                }
            });

            activeFoodMarkers.push(marker);
        }

        function updatePlayerPosition(coords) {
            userCoords = coords;

            if (!lastScanPosition) {
                lastScanPosition = coords;
                scanNearbyRealPlaces();
            } else {
                // 🚶 移動超過 50 公尺自動重新動態生成新能量球
                const walkedDist = getDistance(lastScanPosition[0], lastScanPosition[1], coords[0], coords[1]);
                if (walkedDist >= 50) {
                    lastScanPosition = coords;
                    scanNearbyRealPlaces();
                }
            }

            if (previousPosition) {
                const moved = getDistance(previousPosition[0], previousPosition[1], coords[0], coords[1]);
                if (moved >= 3) {
                    totalDistanceMeters += moved;
                    previousPosition = coords;
                    saveLocalState();
                    syncDataToGAS();
                }
            } else {
                previousPosition = coords;
                map.panTo(coords);
            }

            playerMarker.setLatLng(coords);
            document.getElementById('total-walked').innerText = `🚶 ${(totalDistanceMeters / 1000).toFixed(2)} km`;
        }

        function openExploreModal() {
            renderExploreRockets();
            document.getElementById('explore-modal').style.display = 'flex';
        }

        function closeExploreModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('explore-modal').style.display = 'none';
        }

        function renderExploreRockets() {
            const listEl = document.getElementById('rocket-list');
            listEl.innerHTML = foodTypes.map(food => {
                const count = foodCounts[food.key] || 0;
                const isLaunched = launchedRockets[food.key] === true;
                const isReady = !isLaunched && count >= 12;

                let statusText = `⚡ 能量：${count} / 12`;
                let btnText = '充能中';
                let btnClass = 'launch-btn';

                if (isLaunched) {
                    statusText = `🚀 已完成太空探險`;
                    btnText = '已發射';
                    btnClass = 'launch-btn launched';
                } else if (isReady) {
                    statusText = `⚡ 能量已滿（12/12）`;
                    btnText = '🚀 發射';
                    btnClass = 'launch-btn ready';
                }

                return `
                    <div class="rocket-item ${isLaunched ? 'launched-item' : ''}">
                        <div class="rocket-info">
                            <img src="${food.img}" class="rocket-img" alt="${food.name}">
                            <div class="rocket-text">
                                <div class="rocket-name">${food.rocketName} (${food.name})</div>
                                <div class="rocket-progress-text">${statusText}</div>
                            </div>
                        </div>
                        <button class="${btnClass}" 
                                onclick="${isReady ? `launchRocket('${food.key}')` : ''}" 
                                ${!isReady ? 'disabled' : ''}>
                            ${btnText}
                        </button>
                    </div>
                `;
            }).join('');
        }

        function launchRocket(foodKey) {
            const food = foodTypes.find(f => f.key === foodKey);
            if (!food || launchedRockets[foodKey] || (foodCounts[foodKey] || 0) < 12) return;

            closeExploreModal();

            const videoOverlay = document.getElementById('video-overlay');
            const video = document.getElementById('rocket-video');

            video.src = food.video;
            videoOverlay.style.display = 'flex';

            video.play().catch(e => console.log("影片自動播放被阻止", e));

            video.onended = () => {
                videoOverlay.style.display = 'none';
                video.src = '';

                foodCounts[foodKey] -= 12;
                launchedRockets[foodKey] = true;

                const rand = Math.random();
                let coins = 1;
                if (rand > 0.85) coins = 3;
                else if (rand > 0.50) coins = 2;

                saveLocalState();
                syncDataToGAS();

                showCoinRewardModal(coins, `🪐 發射【${food.rocketName}】抵達【${food.planetName}】！`);
            };
        }

        function showCoinRewardModal(coins, titleMsg) {
            const modal = document.getElementById('coin-reward-modal');
            const titleEl = document.getElementById('coin-modal-title');
            const descEl = document.getElementById('coin-modal-desc');
            const btnEl = document.getElementById('coin-modal-link-btn');

            const link = LINE_STAMP_URLS[coins] || LINE_STAMP_URLS[1];

            titleEl.innerText = titleMsg || `🎉 獲得 ${coins} 枚金幣！`;
            descEl.innerHTML = `恭喜您獲得 <b>${coins} 枚金幣獎勵</b>！<br>請點擊下方按鈕直接連線至 LINE 領取集點！`;
            btnEl.onclick = () => { window.location.href = link; };

            modal.style.display = 'flex';
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function startGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    pos => updatePlayerPosition([pos.coords.latitude, pos.coords.longitude]),
                    err => console.log('GPS 存取失敗'),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        function recenterMap() { if (map && userCoords) map.flyTo(userCoords, 16); }
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3500);
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function skipLoginForTesting() {
            document.getElementById('login-overlay').style.display = 'none';
            currentLineId = 'test_guest'; currentName = '測試玩家';
            document.getElementById('brand-title').innerText = `🌸 ${currentName}`;
            startGeolocation();
        }
        function checkUrlParamsAndInit() { document.getElementById('login-overlay').style.display = 'none'; startGeolocation(); }
        function saveLocalState() {}
        function syncDataToGAS() {}

        window.onload = initMap;
    </script>
</body>
</html>
