<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAKAO WALK arr!</title>
    
    <!-- 🌸 遊戲瀏覽器圖標 (JPG) -->
    <link rel="icon" href="./logo.jpg" type="image/jpeg">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --pastel-bg: #fffcf5;
            --pastel-card: rgba(255, 255, 255, 0.92);
            --pastel-pink: #ffb7c5;
            --pastel-yellow: #ffd3b6;
            --text-color: #5c544d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--pastel-bg);
            color: var(--text-color);
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* 🔒 滿版強制登入遮罩 / 滿版封面 */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 🖼️ 全螢幕滿版圖片設定 */
        .bg-cover-picture {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-cover-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* 🔘 置中內容與按鈕區塊 */
        .login-content {
            position: relative;
            z-index: 2;
            width: 85%;
            max-width: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .full-line-btn {
            width: 100%;
            background-color: #06C755;
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s ease, background-color 0.2s;
            letter-spacing: 0.5px;
        }

        .full-line-btn:active {
            transform: scale(0.96);
        }

        .hud-top {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 420px;
            background: var(--pastel-card);
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(180, 160, 150, 0.15);
            border: 2px solid #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
