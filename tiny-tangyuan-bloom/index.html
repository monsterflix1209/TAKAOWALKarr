<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TinyTangyuan BLOOM｜小湯圓・花開日記</title>
<meta name="description" content="TinyTangyuan BLOOM — 走出去一點點，世界就會柔軟一點點。">
<style>
:root{--ink:#334052;--muted:#7b8794;--paper:#fffdf8;--blue:#9ed8e8;--green:#b9dfc0;--pink:#f5bfd1;--yellow:#f7df9b;--shadow:0 18px 50px #64748b18}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef9fb,#fffaf1);font-family:ui-rounded,"Noto Sans TC",system-ui,sans-serif;color:var(--ink)}button{font:inherit;border:0;cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100vh;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:29px;box-shadow:var(--shadow)}h1{font-size:20px;margin:0}.tag{font-size:12px;color:var(--muted)}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#ffffffb8;border:1px solid #fff;padding:8px 12px;border-radius:999px;font-size:13px}.hero{background:linear-gradient(160deg,#dff5f7,#fff8e9);border:1px solid #fff;border-radius:30px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero h2{font-size:clamp(28px,5vw,52px);line-height:1.05;margin:4px 0 10px;letter-spacing:-2px}.hero p{max-width:650px;color:#657384;margin:0 0 18px}.cta{background:#4f8e9d;color:white;padding:13px 20px;border-radius:16px;box-shadow:0 10px 25px #4f8e9d33}.layout{display:grid;grid-template-columns:1.5fr .8fr;gap:14px;margin-top:14px}.panel{background:#ffffffcc;border:1px solid #fff;border-radius:26px;padding:16px;box-shadow:var(--shadow)}.map{height:470px;position:relative;overflow:hidden;background:linear-gradient(145deg,#d8efe2 0 32%,#f7edca 32% 58%,#d7eef5 58%);border-radius:20px}.map:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(28deg,transparent 0 48px,#ffffff66 49px 52px),repeating-linear-gradient(110deg,transparent 0 70px,#ffffff55 71px 74px);mix-blend-mode:soft-light}.road{position:absolute;background:#fff9;border-radius:99px;transform:rotate(-20deg);height:26px;width:120%;left:-10%;top:47%;box-shadow:0 4px 0 #c4cfc8}.road.r2{transform:rotate(48deg);top:22%;left:-5%}.water{position:absolute;right:-10%;bottom:-8%;width:48%;height:45%;background:#a9deebaa;border-radius:50%}.pin{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 8px 22px #536b6a33;font-size:24px;transition:.2s}.pin:hover{transform:translate(-50%,-50%) scale(1.15)}.pin.active{outline:4px solid #ffffffaa}.tangyuan{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-size:66px;filter:drop-shadow(0 12px 6px #536b6a33);animation:bob 1.8s ease-in-out infinite;z-index:3}.bubble{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:#fff;padding:8px 13px;border-radius:15px;box-shadow:0 8px 22px #536b6a22;font-size:13px;z-index:4;white-space:nowrap}.flower{position:absolute;font-size:22px;animation:pop .35s ease-out;z-index:2}.side{display:flex;flex-direction:column;gap:14px}.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{background:#fff;border-radius:18px;padding:13px}.num{font-size:24px;font-weight:800}.label{font-size:12px;color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.tab{background:#ffffffb8;padding:12px 7px;border-radius:16px;text-align:center;color:#657384}.tab.on{background:#fff;box-shadow:var(--shadow);color:#3e7480}.content{margin-top:14px;min-height:190px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-title h3{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}.sprout{border-radius:18px;padding:13px;background:linear-gradient(145deg,#fff,#eef9f1);border:1px solid #edf1ed}.sprout .emoji{font-size:32px}.diary{line-height:1.8;background:#fffdf4;border-radius:18px;padding:16px;border:1px dashed #dbcfa9}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{padding:9px 12px;border-radius:12px;background:#eef5f4;color:#42616a}.small.primary{background:#4f8e9d;color:#fff}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#334052;color:white;padding:12px 17px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}footer{text-align:center;color:#88929c;font-size:12px;padding:24px}@keyframes bob{50%{transform:translate(-50%,-58%) scale(1.03)}}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}@media(max-width:760px){.layout{grid-template-columns:1fr}.map{height:390px}.tabs{grid-template-columns:repeat(5,1fr)}.tab{font-size:11px;padding:10px 2px}.hero{padding:18px}.top{align-items:flex-start}.pills{justify-content:flex-end}.pill{font-size:11px;padding:7px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">⚪</div><div><h1>TinyTangyuan BLOOM</h1><div class="tag">小湯圓・花開日記</div></div></div><div class="pills"><div class="pill">🌸 <b id="flowers">0</b> 花</div><div class="pill">🌱 <b id="sprouts">0</b> 芽</div></div></header>
<section class="hero"><div class="tag">THIS WORLD IS TOO HARD.</div><h2>走出去一點點，<br>世界就會柔軟一點點。</h2><p>這是一個「陪你生活」的散步原型。你不用刷任務，只要走一點、發現一點、留下今天的記憶。</p><button class="cta" onclick="startWalk()">🚶 和小湯圓一起出發</button></section>
<div class="layout"><section class="panel"><div class="section-title"><h3>🗺️ 今日散步地圖</h3><span class="label" id="location">模擬世界</span></div><div class="map" id="map"><div class="water"></div><div class="road"></div><div class="road r2"></div><div class="bubble" id="bubble">「今天要去哪裡？」</div><div class="tangyuan" id="tangyuan">⚪</div><button class="pin" style="left:18%;top:70%" onclick="discover('公園','🌳')">🌳</button><button class="pin" style="left:73%;top:28%" onclick="discover('車站','🚉')">🚉</button><button class="pin" style="left:80%;top:72%" onclick="discover('海邊','🌊')">🌊</button><button class="pin" style="left:37%;top:23%" onclick="discover('小店','🏪')">🏪</button></div><div class="actions" style="margin-top:10px"><button class="small primary" onclick="walkStep()">👣 走一小步</button><button class="small" onclick="plantFlower()">🌸 種一朵花</button><button class="small" onclick="geo()">📍 嘗試定位</button></div></section>
<aside class="side"><section class="panel"><div class="section-title"><h3>☀️ 今日狀態</h3><span id="mood">🌱 平靜</span></div><div class="stat"><div class="card"><div class="num" id="steps">0</div><div class="label">今日步數（遊戲）</div></div><div class="card"><div class="num" id="places">0</div><div class="label">發現地點</div></div><div class="card"><div class="num" id="days">1</div><div class="label">陪伴天數</div></div><div class="card"><div class="num" id="memories">0</div><div class="label">今日記憶</div></div></div></section><section class="panel"><div class="section-title"><h3>📖 今日小事</h3></div><div class="diary" id="diary">今天還沒有發生什麼大事。<br>但是，我們可以一起走一點點。</div></section></aside></div>
<nav class="tabs"><button class="tab on" onclick="show('home',this)">🏡<br>家</button><button class="tab" onclick="show('walk',this)">🗺️<br>散步</button><button class="tab" onclick="show('buds',this)">🌱<br>夥伴</button><button class="tab" onclick="show('diary',this)">📖<br>日記</button><button class="tab" onclick="show('collection',this)">🎒<br>收藏</button></nav>
<section class="panel content" id="content"></section><footer>Prototype · TinyTangyuan BLOOM · 「今天也一起走了一點點。」</footer></div><div class="toast" id="toast"></div>
<script>
const KEY='tty-bloom-save-v1';const flowers=['🌸','🌼','🌷','🌺','🌻','💮'];const buds=[['🌱','草芽','喜歡公園'],['🌸','花芽','喜歡花田'],['💧','水芽','喜歡河邊'],['🍂','秋芽','喜歡森林'],['❄️','雪芽','喜歡冷冷的地方'],['🌙','夜芽','晚上才出現'],['⭐','星芽','非常稀有']];
let s=JSON.parse(localStorage.getItem(KEY)||'null')||{steps:0,flowers:0,sprouts:1,places:0,memories:0,days:1,found:[],planted:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}function render(){for(const id of ['steps','flowers','sprouts','places','memories','days'])document.getElementById(id).textContent=s[id];document.getElementById('diary').innerHTML=diaryText();}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function walkStep(){s.steps+=100;s.memories++;const m=['🌱 平靜','☀️ 開心','🍃 放空','✨ 興奮'];document.getElementById('mood').textContent=m[Math.floor(s.steps/100)%m.length];document.getElementById('bubble').textContent=s.steps%500===0?'「我們又走遠一點了。」':'「一起走吧。」';if(Math.random()<.22){s.sprouts++;toast('🌱 發現了一顆新的湯圓芽！')}save()}
function startWalk(){walkStep();document.getElementById('tangyuan').animate([{transform:'translate(-50%,-50%)'},{transform:'translate(-20%,-50%)'},{transform:'translate(-50%,-50%)'}],{duration:700});toast('⚪ 小湯圓跟上來了！')}
function plantFlower(){s.flowers++;s.memories++;const map=document.getElementById('map');const f=document.createElement('div');f.className='flower';f.textContent=flowers[Math.floor(Math.random()*flowers.length)];f.style.left=(10+Math.random()*80)+'%';f.style.top=(10+Math.random()*75)+'%';map.appendChild(f);s.planted.push(f.textContent);toast('🌸 世界變柔軟了一點。');save()}
function discover(name,icon){if(!s.found.includes(name)){s.found.push(name);s.places++;s.memories++;s.sprouts++;document.getElementById('bubble').textContent=`「${icon} ${name}……記住了。」`;toast(`📍 發現：${name} ＋新的湯圓芽`)}else toast(`⚪「我們又回到${name}了。」`);save()}
function diaryText(){const d=new Date();const date=d.toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'});return `<b>${date}</b><br>今天走了 <b>${s.steps.toLocaleString()}</b> 步。<br>種下了 <b>${s.flowers}</b> 朵花，發現 <b>${s.places}</b> 個地方。<br><br>「今天沒有發生什麼大事。<br>但是，我很喜歡。」`}
function show(tab,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');const c=document.getElementById('content');if(tab==='home')c.innerHTML='<div class="section-title"><h3>🏡 小湯圓小屋</h3><span class="label">你的私人小空間</span></div><div class="grid"><div class="sprout"><div class="emoji">🛋️</div><b>柔軟沙發</b><div class="label">小湯圓最喜歡坐著發呆。</div></div><div class="sprout"><div class="emoji">📮</div><b>明信片牆</b><div class="label">旅行的記憶會住在這裡。</div></div><div class="sprout"><div class="emoji">🪴</div><b>窗邊花盆</b><div class="label">今天也可以再種一朵。</div></div></div>';if(tab==='walk')c.innerHTML='<div class="section-title"><h3>🚶 散步模式</h3><span class="label">不用一直盯著螢幕</span></div><p>真實版未接入 GPS 時，使用「走一小步」模擬散步。正式版可接手機定位、步數與背景探索。</p><button class="small primary" onclick="startWalk()">出發</button>';if(tab==='buds')c.innerHTML='<div class="section-title"><h3>🌱 湯圓芽圖鑑</h3><span class="label">收集不是戰力，是記憶</span></div><div class="grid">'+buds.map((b,i)=>`<div class="sprout"><div class="emoji">${b[0]}</div><b>${b[1]}</b><div class="label">${i<s.sprouts?b[2]:'尚未發現'}</div></div>`).join('')+'</div>';if(tab==='diary')c.innerHTML='<div class="section-title"><h3>📖 今日小湯圓日記</h3><span class="label">「一起走了一點點。」</span></div><div class="diary">'+diaryText()+'</div>';if(tab==='collection')c.innerHTML='<div class="section-title"><h3>🎒 我的記憶</h3><span class="label">花就是記憶</span></div><div class="grid"><div class="sprout"><div class="emoji">🌸</div><b>花朵</b><div class="label">已種下 '+s.flowers+' 朵</div></div><div class="sprout"><div class="emoji">📍</div><b>足跡</b><div class="label">'+(s.found.join('、')||'還沒有地點')+'</div></div><div class="sprout"><div class="emoji">📸</div><b>相簿</b><div class="label">正式版將加入 AR 拍照</div></div></div>'}
function geo(){if(!navigator.geolocation){toast('此瀏覽器不支援定位');return}navigator.geolocation.getCurrentPosition(p=>{document.getElementById('location').textContent=`定位成功 · ${p.coords.latitude.toFixed(3)}, ${p.coords.longitude.toFixed(3)}`;toast('📍 已取得目前位置（僅本機顯示）')},()=>toast('📍 定位未開啟，仍可玩模擬散步'))}
render();show('home',document.querySelector('.tab'));
</script></body></html>
